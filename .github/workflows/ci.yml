name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun test
      - run: bun run check
      - run: bun run build
      - run: bun scripts/smoke.ts
      - run: docker build -t anvian-web .
      - run: |
          docker run -d --name web -p 8080:80 anvian-web
          sleep 3
          curl --fail http://localhost:8080/projects/
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: blog.anvian.net' http://localhost:8080/posts/mcmodtest/)" = 301
          check_redirect() {
            method="$1"; path="$2"; expected="$3"; shift 3
            headers="$(curl -sS -D - -o /dev/null -X "$method" "$@" -H 'Host: anvian.net' "http://localhost:8080$path")"
            printf '%s\n' "$headers" | tr -d '\r' | grep -q '^HTTP/1.1 308 '
            printf '%s\n' "$headers" | tr -d '\r' | grep -Fqi "Location: $expected"
          }
          check_redirect GET '/telemetry/mods?source=tui' 'https://telemetry.anvian.net/mods?source=tui'
          check_redirect POST '/telemetry/data?source=mod' 'https://telemetry.anvian.net/data?source=mod' --data '{"mod_id":"test"}' -H 'Content-Type: application/json'
          check_redirect GET '/telemetry/export/stats?period=2026-07' 'https://telemetry.anvian.net/export/stats?period=2026-07'
